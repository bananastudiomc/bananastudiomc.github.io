<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Studios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FFF001;
            overflow: hidden;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFF001;
            z-index: 9999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="logo-video" autoplay muted playsinline preload="auto">
            <source src="bananastudioindex.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('logo-video');
        let startTime = Date.now();
        let speedSet = false;

        function checkBufferSpeed() {
            if (speedSet) return;
            if (video.buffered.length === 0) return;
            
            const buffered = video.buffered.end(0);
            const duration = video.duration;
            if (duration === 0) return;
            
            const elapsed = (Date.now() - startTime) / 1000;
            if (elapsed < 1) return;
            
            const speed = buffered / elapsed;
            
            let rate = 1.0;
            if (speed < 0.5) {
                rate = 1.0;
            } else if (speed < 1.0) {
                rate = 1.2;
            } else if (speed < 2.0) {
                rate = 1.5;
            } else if (speed < 4.0) {
                rate = 2.0;
            } else if (speed < 8.0) {
                rate = 2.5;
            } else {
                rate = 3.0;
            }
            
            video.playbackRate = rate;
            speedSet = true;
        }

        video.addEventListener('progress', function() {
            checkBufferSpeed();
        });

        video.addEventListener('loadeddata', function() {
            if (!speedSet) {
                const elapsed = (Date.now() - startTime) / 1000;
                if (elapsed > 0.5) {
                    const speed = video.duration / elapsed;
                    let rate = 1.0;
                    if (speed < 0.5) rate = 1.0;
                    else if (speed < 1.0) rate = 1.2;
                    else if (speed < 2.0) rate = 1.5;
                    else if (speed < 4.0) rate = 2.0;
                    else if (speed < 8.0) rate = 2.5;
                    else rate = 3.0;
                    video.playbackRate = rate;
                    speedSet = true;
                }
            }
        });

        setTimeout(function() {
            if (!speedSet) {
                video.playbackRate = 1.0;
                speedSet = true;
            }
        }, 5000);

        video.play().catch(function(error) {
            document.body.addEventListener('click', function() {
                video.play();
            }, { once: true });
        });

        video.addEventListener('ended', function() {
            window.location.href = 'https://bananastudiomc.github.io/bananastudiohome.html';
        });

        video.addEventListener('error', function() {
            setTimeout(function() {
                window.location.href = 'https://bananastudiomc.github.io/bananastudiohome.html';
            }, 3000);
        });
    </script>
</body>
</html>
