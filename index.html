<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banana Studios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #FFF001;
            overflow: hidden;
        }
        #video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFF001;
            z-index: 9999;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <video id="logo-video" autoplay muted playsinline>
            <source src="bananastudioindex.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const video = document.getElementById('logo-video');
        
        video.play().catch(function(error) {
            console.log("自动播放被阻止:", error);
            document.body.addEventListener('click', function() {
                video.play();
            }, { once: true });
        });
        
        video.addEventListener('ended', function() {
            window.location.href = 'https://bananastudiomc.github.io/bananastudiohome.html';
        });
        
        video.addEventListener('error', function() {
            setTimeout(function() {
                window.location.href = 'https://bananastudiomc.github.io/bananastudiohome.html';
            }, 3000);
        });
    </script>
</body>
</html>
